name: Application checks

on:
  push:
    branches: [main, flavius]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m coverage run --rcfile=../.coveragerc --source=app -m unittest discover -s tests -v
        working-directory: backend
        env:
          GEMINI_API_KEY: ''
      - run: python -m coverage report --rcfile=../.coveragerc
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: node --test tests/proxy.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
  render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.render -t 4next-render-check .
      - name: Start the combined free-demo image
        run: >-
          docker run -d --name 4next-render-check
          -p 127.0.0.1:18080:10000
          -e RENDER_EXTERNAL_URL=https://4next-ci.onrender.com
          -e STORAGE_MODE=ephemeral
          4next-render-check
      - run: python scripts/smoke_render.py http://127.0.0.1:18080
      - if: always()
        run: docker logs 4next-render-check
      - if: always()
        run: docker rm -f 4next-render-check
